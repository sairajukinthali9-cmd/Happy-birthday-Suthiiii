<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Sruthiii🌸</title>
<link rel="preconnect" hreff="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ivory: #F3F8F1;
  --ivory-deep: #E9F2E5;
  --blush: #CDE6C7;
  --blush-soft: #E4F3E0;
  --rose-gold: #8FBF83;
  --rose-gold-deep: #4C8A5A;
  --plum: #1F3A2C;
  --plum-soft: #4E6957;
  --lavender: #C8E8D8;
  --champagne: #E3C99B;
  --gold: #C9A25D;
  --gold-bright: #E7C77E;
  --glow: #FFF8EE;
  --shadow-soft: 0 20px 60px -20px rgba(31,58,44,0.25);
  --shadow-card: 0 10px 40px -12px rgba(31,58,44,0.18);
  --ease: cubic-bezier(.22,1,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;}

html{ scroll-behavior:smooth; overflow-x:hidden; width:100%; }

body{
  font-family:'Jost', sans-serif;
  background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-deep) 100%);
  color: var(--plum);
  overflow-x:hidden;
  cursor:none;
}

@media (max-width: 900px){
  body{cursor:auto;}
}

::selection{ background: var(--blush); color: var(--plum); }

.script{ font-family:'Alex Brush', cursive; }
.display{ font-family:'Playfair Display', serif; }

/* ---------- LOADER ---------- */
#loader{
  position:fixed; inset:0; z-index:9999;
  background: var(--ivory);
  display:flex; align-items:center; justify-content:center;
  transition: opacity 1s var(--ease), visibility 1s var(--ease);
}
#loader.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.loader-flower{ width:120px; height:120px; }
.loader-petal{
  transform-origin: 60px 60px;
  animation: bloom 1.8s var(--ease) infinite;
  fill: var(--rose-gold);
  opacity:0.85;
}
.loader-petal:nth-child(1){ animation-delay:0s; }
.loader-petal:nth-child(2){ transform:rotate(60deg); animation-delay:0.1s; fill:var(--blush);}
.loader-petal:nth-child(3){ transform:rotate(120deg); animation-delay:0.2s; }
.loader-petal:nth-child(4){ transform:rotate(180deg); animation-delay:0.3s; fill:var(--blush);}
.loader-petal:nth-child(5){ transform:rotate(240deg); animation-delay:0.4s; }
.loader-petal:nth-child(6){ transform:rotate(300deg); animation-delay:0.5s; fill:var(--blush);}
@keyframes bloom{
  0%,100%{ transform-box:fill-box; transform:scale(0.3) rotate(var(--r,0deg)); opacity:0.3;}
  50%{ transform-box:fill-box; transform:scale(1) rotate(var(--r,0deg)); opacity:1;}
}
.loader-text{
  position:absolute; margin-top:200px; font-size:1rem; letter-spacing:0.3em;
  text-transform:uppercase; color:var(--plum-soft); font-family:'Jost';
}

/* ---------- CURSOR ---------- */
#cursor-glow{
  position:fixed; width:26px; height:26px; border-radius:50%;
  background: radial-gradient(circle, rgba(233,197,140,0.55), rgba(243,203,214,0.15) 60%, transparent 70%);
  pointer-events:none; z-index:9998; transform:translate(-50%,-50%);
  transition: width .2s ease, height .2s ease, opacity .3s ease;
  mix-blend-mode: multiply;
}
@media (max-width:900px){ #cursor-glow{display:none;} }

/* ---------- SCROLL PROGRESS ---------- */
#scroll-progress{
  position:fixed; top:0; left:0; height:3px; width:0%;
  background: linear-gradient(90deg, var(--rose-gold), var(--gold-bright), var(--blush));
  z-index:9997; transition: width .1s linear;
}

/* ---------- AMBIENT BACKGROUND ---------- */
#ambient-canvas{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.7;
}

#petal-layer, #butterfly-layer{
  position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;
}

/* ---------- NAV ---------- */
nav{
  position:fixed; top:0; left:0; right:0; z-index:500;
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 5vw;
  background: rgba(251,246,239,0.55);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid rgba(201,162,93,0.15);
  transition: transform .4s var(--ease);
}
nav.nav-hide{ transform: translateY(-100%); }
.nav-logo{ font-family:'Alex Brush', cursive; font-size:1.7rem; color:var(--rose-gold-deep); }
.nav-links{ display:flex; gap:28px; list-style:none; }
.nav-links a{
  text-decoration:none; color:var(--plum); font-size:0.78rem; letter-spacing:0.14em;
  text-transform:uppercase; opacity:0.75; transition: opacity .3s, color .3s;
  position:relative;
}
.nav-links a::after{
  content:''; position:absolute; left:0; bottom:-4px; width:0; height:1px;
  background:var(--gold); transition:width .3s var(--ease);
}
.nav-links a:hover{ opacity:1; color:var(--rose-gold-deep); }
.nav-links a:hover::after{ width:100%; }
@media (max-width:760px){ .nav-links{ display:none; } }

.nav-right{ display:flex; align-items:center; gap:10px; }
.song-name{
  font-size:0.68rem; letter-spacing:0.08em; color:var(--plum-soft);
  opacity:0; max-width:0; overflow:hidden; white-space:nowrap;
  transition: opacity .4s var(--ease), max-width .4s var(--ease), margin .4s var(--ease);
}
.song-name.show{ opacity:0.85; max-width:140px; margin-right:2px; }
.song-name::before{ content:'♪ '; color:var(--gold); }

#music-toggle{
  width:42px; height:42px; border-radius:50%;
  border:1px solid rgba(201,162,93,0.4);
  background: rgba(255,255,255,0.4);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition: all .3s var(--ease);
}
#music-toggle:hover{ background: var(--blush-soft); transform:scale(1.08); }
#music-toggle svg{ width:18px; height:18px; fill:var(--rose-gold-deep); }

/* ---------- DECORATIVE PAGE FRAME ---------- */
#page-frame{
  position:fixed; inset:12px; z-index:400; pointer-events:none;
  border-radius:22px;
  border: 1.5px solid transparent;
  border-image: linear-gradient(135deg, var(--gold-bright), var(--rose-gold), var(--lavender), var(--gold-bright)) 1;
  opacity:0.55;
}
.frame-corner{
  position:fixed; width:52px; height:52px; z-index:401; pointer-events:none; opacity:0.85;
  filter: drop-shadow(0 2px 6px rgba(74,46,66,0.15));
}
.frame-corner.tl{ top:6px; left:6px; }
.frame-corner.tr{ top:6px; right:6px; transform:scaleX(-1); }
.frame-corner.bl{ bottom:6px; left:6px; transform:scaleY(-1); }
.frame-corner.br{ bottom:6px; right:6px; transform:scale(-1,-1); }
@media (max-width:700px){
  #page-frame{ inset:5px; opacity:0.4; }
  .frame-corner{ width:32px; height:32px; opacity:0.6; }
}

/* ---------- SECTIONS GENERAL ---------- */
section{
  position:relative; z-index:2; padding: 140px 8vw;
}
.section-inner{ max-width:1000px; margin:0 auto; position:relative; }

.eyebrow{
  font-size:0.75rem; letter-spacing:0.35em; text-transform:uppercase;
  color:var(--rose-gold-deep); opacity:0.8; margin-bottom:18px; display:inline-block;
}

.reveal{ opacity:0; transform: translateY(50px); transition: opacity 1s var(--ease), transform 1.1s var(--ease); }
.reveal.in-view{ opacity:1; transform:none; }
.reveal-zoom{ opacity:0; transform: scale(0.85); transition: opacity 1s var(--ease), transform 1.1s var(--ease); }
.reveal-zoom.in-view{ opacity:1; transform:scale(1); }
.reveal-side-l{ opacity:0; transform: translateX(-60px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
.reveal-side-l.in-view{ opacity:1; transform:none; }
.reveal-side-r{ opacity:0; transform: translateX(60px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
.reveal-side-r.in-view{ opacity:1; transform:none; }

/* wave divider */
.wave{ display:block; width:100%; position:relative; z-index:3; margin-top:-2px; }

/* ---------- HERO ---------- */
#hero{
  min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding-top:100px; position:relative; overflow:hidden;
}
.hero-ribbon{ position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.5; pointer-events:none;}
.hero-title{
  font-size: clamp(2.6rem, 7vw, 5.2rem);
  font-family:'Playfair Display', serif; font-weight:600; font-style:italic;
  color: var(--plum); line-height:1.15; position:relative; z-index:2;
}
.hero-title .name-script{
  font-family:'Alex Brush', cursive; font-style:normal;
  font-size:1.5em; color: var(--rose-gold-deep);
  display:block; margin-top:6px;
  background: linear-gradient(90deg, var(--rose-gold-deep), var(--gold-bright), var(--rose-gold-deep));
  background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmer 5s linear infinite;
}
@keyframes shimmer{ to{ background-position:200% center; } }

.hero-subtitle{
  margin-top:26px; font-size:1.15rem; font-weight:300; letter-spacing:0.02em;
  color: var(--plum-soft); max-width:520px; z-index:2; position:relative;
}

/* ---------- GIFT BOX (signature hero interaction) ---------- */
.gift-wrap{ margin: 46px 0 30px; position:relative; z-index:2; cursor:pointer; }
.gift-wrap svg{ width:150px; height:auto; filter: drop-shadow(0 20px 30px rgba(169,106,84,0.25)); overflow:visible; }

.hero-anim{
  position:absolute; width:90px; height:auto; z-index:2; pointer-events:none;
  border-radius:50%; overflow:hidden; box-shadow: var(--shadow-card);
  border: 3px solid rgba(255,255,255,0.7);
  top:6%; right:8%;
  animation: hero-anim-float 5s ease-in-out infinite;
}
.hero-anim video{ width:100%; height:100%; display:block; object-fit:cover; }
@keyframes hero-anim-float{
  0%,100%{ transform: translateY(0) rotate(-4deg); }
  50%{ transform: translateY(-14px) rotate(4deg); }
}
@media (max-width:700px){
  .hero-anim{ width:60px; top:4%; right:6%; }
}

.gift-wrap.idle-bounce{ animation: gift-bounce 4s ease-in-out infinite; }
.gift-wrap.opened{ animation:none; }
@keyframes gift-bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

.gift-lid{ transform-origin: 50% 100%; transition: transform .8s cubic-bezier(.34,1.56,.64,1); }
.gift-lid.open{ transform: translate(-4px,-10px) rotate(-14deg); }

.gift-bow-l, .gift-bow-r{ transform-origin:center; transition: transform .5s var(--ease), opacity .5s var(--ease); }
.gift-ribbon-v, .gift-ribbon-h{ transition: opacity .4s ease; }
.gift-wrap.gift-untied .gift-bow-l{ transform: translate(-12px,-8px) rotate(-40deg); opacity:0; }
.gift-wrap.gift-untied .gift-bow-r{ transform: translate(12px,-8px) rotate(40deg); opacity:0; }
.gift-wrap.gift-untied .gift-ribbon-v{ opacity:0; }

.gift-glow{ opacity:0; transition: opacity .9s ease; pointer-events:none; }
.gift-glow.show{ opacity:1; }

.gift-messages{
  position:absolute; top:-14px; left:50%; transform:translate(-50%,-10px);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  pointer-events:none; width:max-content; max-width:230px;
}
.gift-msg-line{
  font-family:'Playfair Display', serif; font-style:italic; font-size:0.88rem;
  color: var(--rose-gold-deep); background: rgba(255,255,255,0.8);
  padding:8px 18px; border-radius:20px; white-space:nowrap;
  box-shadow: var(--shadow-card); opacity:0; transform:translateY(8px) scale(0.94);
  transition: opacity .6s ease, transform .6s var(--ease);
}
.gift-msg-line.show{ opacity:1; transform:translateY(0) scale(1); }

@media (max-width:480px){
  .gift-wrap{ transform: scale(0.8); margin: 30px 0 14px; }
  .gift-msg-line{ font-size:0.76rem; white-space:normal; text-align:center; max-width:200px; }
  .hero-title{ font-size: clamp(2.1rem, 9vw, 3.2rem); }
  .hero-subtitle{ font-size: 1rem; padding: 0 6vw; }
  section{ padding: 100px 6vw; }
}
@media (max-width:380px){
  .gift-wrap{ transform: scale(0.7); }
}

.flame{ animation: flicker 1.6s ease-in-out infinite; transform-origin:bottom center; transition: opacity .5s ease, transform .5s ease; }@keyframes flicker{
  0%,100%{ transform:scaleY(1) rotate(-2deg); }
  50%{ transform:scaleY(1.15) rotate(2deg); }
}

.celebrate-btn{
  z-index:2; position:relative; margin-top:10px;
  padding: 16px 44px; border-radius:50px; border:none; cursor:pointer;
  font-family:'Jost'; letter-spacing:0.12em; text-transform:uppercase; font-size:0.82rem;
  color: var(--ivory);
  background: linear-gradient(135deg, var(--rose-gold-deep), var(--rose-gold), var(--gold-bright));
  box-shadow: 0 15px 40px -10px rgba(169,106,84,0.55);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.celebrate-btn:hover{ transform: translateY(-4px) scale(1.03); box-shadow: 0 20px 50px -8px rgba(169,106,84,0.65); }

.scroll-cue{
  position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px; z-index:2;
  opacity:0.65;
}
.scroll-cue .line{ width:1px; height:38px; background: linear-gradient(var(--rose-gold-deep), transparent); animation: scrolldown 2s ease infinite; }
@keyframes scrolldown{ 0%{ transform:scaleY(0); transform-origin:top;} 50%{transform:scaleY(1); transform-origin:top;} 51%{transform-origin:bottom;} 100%{transform:scaleY(0); transform-origin:bottom;} }

/* ---------- GLASS CARD ---------- */
.glass-card{
  background: rgba(255,255,255,0.42);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 28px;
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: var(--shadow-card);
  padding: 56px 50px;
  position:relative;
  overflow:hidden;
}
.glass-card::before{
  content:''; position:absolute; top:-40%; right:-20%; width:280px; height:280px;
  background: radial-gradient(circle, rgba(243,203,214,0.55), transparent 70%);
  border-radius:50%; pointer-events:none;
}
@media (max-width:640px){ .glass-card{ padding:36px 26px; } }

.center-title{
  font-family:'Playfair Display', serif; font-size:clamp(1.8rem,4vw,2.6rem);
  font-style:italic; font-weight:600; text-align:center; margin-bottom:36px; color:var(--plum);
}

.story-text p{
  font-size:1.15rem; font-weight:300; line-height:1.9; color:var(--plum-soft);
  margin-bottom:22px; text-align:center;
}
.story-text p:last-child{ margin-bottom:0; }

/* ---------- APPRECIATION ---------- */
.card-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:32px; margin-top:20px;
}
@media (max-width:860px){ .card-grid{ grid-template-columns:1fr; } }

.icon-card{
  background: rgba(255,255,255,0.55);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:24px; padding:40px 28px; text-align:center;
  box-shadow: var(--shadow-card);
  transition: transform .5s var(--ease), box-shadow .5s var(--ease);
}
.icon-card:hover{ transform: translateY(-10px); box-shadow: 0 25px 50px -15px rgba(74,46,66,0.28); }
.icon-card svg{ width:64px; height:64px; margin-bottom:22px; }
.icon-card p{ font-size:1rem; font-weight:300; line-height:1.75; color:var(--plum-soft); }

/* ---------- DREAMS / BANKING ---------- */
#dreams{
  background: linear-gradient(180deg, rgba(227,201,155,0.12), rgba(220,207,236,0.18));
  position:relative;
}
.coin{
  position:absolute; opacity:0.5; animation: float-coin 9s ease-in-out infinite;
}
@keyframes float-coin{
  0%,100%{ transform: translateY(0) rotate(0deg); }
  50%{ transform: translateY(-24px) rotate(12deg); }
}
.growth-path-wrap{ position:relative; margin-top:60px; }
.growth-path-wrap svg{ width:100%; height:auto; overflow:visible; }
.growth-line{
  stroke-dasharray: 1400; stroke-dashoffset:1400;
  transition: stroke-dashoffset 2s var(--ease);
}
.growth-line.in-view{ stroke-dashoffset:0; }
.bloom-badge{
  opacity:0; transform: scale(0.4);
  transition: opacity .8s var(--ease), transform .8s var(--ease);
  transform-origin:center;
}
.bloom-badge.in-view{ opacity:1; transform:scale(1); }

.dreams-text{ max-width:640px; margin: 0 auto 10px; text-align:center; }
.dreams-text p{ font-size:1.12rem; font-weight:300; line-height:1.9; color:var(--plum-soft); margin-bottom:20px; }

/* ---------- FRIENDSHIP ---------- */
#friendship{ text-align:center; }
.avatars-wrap{ position:relative; height:180px; margin: 50px auto 20px; max-width:420px; }
.avatars-wrap svg{ position:absolute; }
.heart-float{ position:absolute; animation: heart-rise 3.5s ease-in infinite; opacity:0; }
@keyframes heart-rise{
  0%{ opacity:0; transform: translateY(0) scale(0.6); }
  15%{ opacity:0.9; }
  100%{ opacity:0; transform: translateY(-90px) scale(1.1); }
}
.friendship-text{ max-width:600px; margin:0 auto; font-size:1.12rem; font-weight:300; line-height:1.9; color:var(--plum-soft); }

/* ---------- MEMORIES GALLERY ---------- */
#memories{ text-align:center; }
.memories-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:26px; margin-top:44px;
}
@media (max-width:640px){ .memories-grid{ grid-template-columns:1fr; } }
.memory-frame{
  position:relative; border-radius:22px; overflow:hidden;
  box-shadow: var(--shadow-card);
  border: 6px solid rgba(255,255,255,0.75);
  transition: transform .5s var(--ease), box-shadow .5s var(--ease);
}
.memory-frame:hover{ transform: translateY(-8px) rotate(-0.5deg); box-shadow: 0 30px 55px -15px rgba(74,46,66,0.3); }
.memory-frame img, .memory-frame video{
  width:100%; height:100%; display:block; object-fit:cover; aspect-ratio:4/3;
}
.memory-caption{
  position:absolute; left:0; right:0; bottom:0;
  padding:18px 16px 14px;
  background: linear-gradient(0deg, rgba(74,46,66,0.65), transparent);
  color:#fff; font-family:'Playfair Display', serif; font-style:italic; font-size:1rem; text-align:left;
}
.memories-text{ max-width:600px; margin: 34px auto 0; font-size:1.1rem; font-weight:300; line-height:1.85; color:var(--plum-soft); }

/* ---------- FAMILY ---------- */
#family{
  background: radial-gradient(circle at 20% 20%, rgba(243,203,214,0.25), transparent 45%),
              radial-gradient(circle at 80% 80%, rgba(220,207,236,0.3), transparent 50%);
}
.family-flowers{ display:flex; justify-content:center; gap:20px; margin-bottom:40px; }
.family-flowers svg{ width:56px; height:56px; animation: sway 5s ease-in-out infinite; }
.family-flowers svg:nth-child(2){ animation-delay:0.6s; }
.family-flowers svg:nth-child(3){ animation-delay:1.2s; }
.family-flowers svg:nth-child(4){ animation-delay:1.8s; }
@keyframes sway{ 0%,100%{ transform:rotate(-6deg);} 50%{ transform:rotate(6deg);} }
.family-text{ max-width:640px; margin:0 auto; text-align:center; font-size:1.15rem; font-weight:300; line-height:1.9; color:var(--plum-soft); }

/* ---------- WISHES ---------- */
#wishes{ text-align:center; }
.wish-card{ max-width:640px; margin:0 auto; }
.wish-card p{ font-size:1.2rem; font-weight:300; line-height:1.9; color:var(--plum-soft); margin-bottom:20px; }
.candles-row{ display:flex; justify-content:center; gap:14px; margin-top:40px; }
.candles-row svg{ width:20px; height:60px; }

/* ---------- FINAL ---------- */
#final{
  min-height: 80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; position:relative;
}
.final-message{
  font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
  font-size: clamp(1.6rem, 4vw, 2.6rem); max-width:760px; line-height:1.5;
  color: var(--plum);
  text-shadow: 0 0 40px rgba(233,197,140,0.35);
}
.bouquet-wrap{ margin-top:50px; }
.bouquet-wrap svg{ width:220px; height:auto; filter: drop-shadow(0 25px 35px rgba(169,106,84,0.25)); }

/* ---------- FOOTER ---------- */
footer{
  text-align:center; padding: 50px 8vw 70px; position:relative; z-index:2;
}
footer p{ font-size:0.85rem; letter-spacing:0.05em; color:var(--plum-soft); font-weight:300; }
footer .script{ color:var(--rose-gold-deep); font-size:1.3rem; display:block; margin-top:8px; }

/* typing */
.typing::after{
  content:'|'; margin-left:4px; animation: blink 0.9s steps(1) infinite; color:var(--gold);
}
@keyframes blink{ 50%{ opacity:0; } }

/* confetti + hearts (click) */
.burst-item{ position:fixed; pointer-events:none; z-index:9996; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count:
